<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kolekta – Edit Koleksi</title>
<meta name="theme-color" content="#0F0C1D">
<link rel="icon" type="image/png" href="../assets/icon.png">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="edit"><div class="app"><nav id="nav"></nav><main class="main">
<header class="page-head"><button class="back" id="backBtn" type="button" aria-label="Kembali"><svg class="ico" viewBox="0 0 24 24"><path d="M12.5 6l-6 6 6 6M19 6l-6 6 6 6"/></svg></button><h1>Edit Your Collection</h1></header>
<form id="form" class="form-split" novalidate>
  <button type="button" class="photo-box" id="photoBtn"><span class="plus"><svg class="ico" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></span>Ambil Foto Koleksi</button>
  <div class="rt"><div class="fields">
    <label class="f full">Nama<input name="nama" placeholder="Masukkan nama koleksi..." autocomplete="off"><small class="err" id="errNama" hidden>Nama koleksi wajib diisi</small></label>
    <label class="f full">Kategori<select name="jenis"></select></label>
    <label class="f">Merk<input name="merk" placeholder="Masukkan merk koleksi..."></label>
    <label class="f">Seri (Jika ada)<input name="seri" placeholder="Masukkan seri koleksi..."></label>
    <label class="f">Harga Beli (Rp)<input name="harga" inputmode="numeric" placeholder="Masukkan harga beli..."></label>
    <label class="f">Tanggal Beli<input name="tanggal" type="date"></label>
    <label class="f">Kondisi<input name="kondisi" placeholder="Masukkan kondisi koleksi..."></label>
    <label class="f">Tempat Beli<input name="tempat" placeholder="Masukkan tempat beli..."></label>
  </div><button class="btn" type="submit">SIMPAN PERUBAHAN</button></div>
</form>
<input type="file" id="fileGallery" accept="image/*" hidden><input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
</main></div>
<script src="../js/storage.js"></script>
<script src="../js/database.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/crop.js"></script>
<script src="../js/edit.js"></script>
<script src="../js/app.js"></script>
</body></html>
